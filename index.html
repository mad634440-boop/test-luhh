<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
<title>SUPER MARIO : PENGEMBARAAN KATA ADJEKTIF (Tahun 5)</title>
</head>
<body>
<div class="sky-backdrop" aria-hidden="true">
  <div class="pixel-cloud" style="top:8%;animation-duration:36s;animation-delay:-4s"></div>
  <div class="pixel-cloud" style="top:22%;animation-duration:50s;animation-delay:-18s;transform:scale(1.25)"></div>
  <div class="pixel-cloud" style="top:38%;animation-duration:42s;animation-delay:-10s;transform:scale(.9)"></div>
</div>
<section id="titleScreen" class="min-h-screen w-full flex flex-col justify-between relative overflow-hidden">

  <div class="w-full max-w-5xl mx-auto px-4 pt-5 flex justify-between items-center font-pixel text-[10px] sm:text-xs text-white drop-shadow-[2px_2px_0px_#000]">
    <div>KSSR SEMAKAN • TAHUN 5</div>
    <div class="flex items-center gap-2"><span class="spinning-coin !w-4 !h-5"></span><span>SP 5.1.3</span></div>
  </div>

  <div class="flex-grow flex flex-col items-center justify-center px-4 py-6 text-center z-10">
    <div class="title-board-anim nes-box bg-[#c84c0c] p-6 sm:p-10 max-w-3xl w-full relative mb-8">
      <div class="w-3.5 h-3.5 bg-yellow-300 border-2 border-black absolute top-2.5 left-2.5"></div>
      <div class="w-3.5 h-3.5 bg-yellow-300 border-2 border-black absolute top-2.5 right-2.5"></div>
      <div class="w-3.5 h-3.5 bg-yellow-300 border-2 border-black absolute bottom-2.5 left-2.5"></div>
      <div class="w-3.5 h-3.5 bg-yellow-300 border-2 border-black absolute bottom-2.5 right-2.5"></div>

      <div class="inline-block bg-black text-yellow-300 font-pixel text-[10px] sm:text-xs px-3.5 py-1.5 rounded mb-5 border-2 border-yellow-400">
        BAHASA MELAYU TAHUN 5 • TATABAHASA (SP 5.1.3)
      </div>
      <h1 class="font-pixel text-xl sm:text-3xl md:text-4xl text-white drop-shadow-[4px_4px_0px_#000] leading-relaxed">
        <span class="text-red-500 bg-white px-3 py-1 rounded border-4 border-black inline-block mb-3 shadow-[4px_4px_0px_#000]">SUPER MARIO</span><br>
        <span class="text-yellow-300">PENGEMBARAAN</span><br>
        <span class="text-white">KATA ADJEKTIF</span>
      </h1>
      <div class="flex items-center justify-center gap-4 mt-6">
        <div class="w-10 h-10 bg-yellow-400 border-4 border-black font-pixel text-lg flex items-center justify-center shadow-[3px_3px_0px_#000]">?</div>
        <span class="spinning-coin"></span>
        <div class="w-10 h-10 bg-yellow-400 border-4 border-black font-pixel text-lg flex items-center justify-center shadow-[3px_3px_0px_#000]">?</div>
      </div>
    </div>

    <button id="btnStart" class="start-btn-anim nes-btn bg-[#43b047] hover:bg-[#389c3c] text-white text-base sm:text-xl md:text-2xl px-10 sm:px-14 py-5 sm:py-6 rounded-2xl">
      <span>▶</span><span>MULA</span>
    </button>
    <p class="font-pixel text-[10px] sm:text-xs text-white drop-shadow-[2px_2px_0px_#000] mt-5">TEKAN MULA UNTUK LOG MASUK</p>
  </div>

  <div class="w-full relative pt-16">
    <div class="max-w-5xl mx-auto px-6 flex items-end justify-between relative z-10">
      <div class="hidden sm:flex items-end">
        <svg width="130" height="75" viewBox="0 0 130 75"><path d="M5,75 Q65,-25 125,75 Z" fill="#22c55e" stroke="#000" stroke-width="4"/><ellipse cx="52" cy="42" rx="6" ry="10" fill="#15803d"/><ellipse cx="78" cy="48" rx="6" ry="10" fill="#15803d"/></svg>
      </div>
      <div class="mario-hero-anim mx-auto sm:mx-0">
        <svg width="64" height="72" viewBox="0 0 16 18" shape-rendering="crispEdges">
          <rect x="4" y="0" width="7" height="2" fill="#e52521"/><rect x="3" y="2" width="10" height="2" fill="#e52521"/>
          <rect x="3" y="4" width="3" height="3" fill="#78350f"/><rect x="6" y="4" width="6" height="4" fill="#fed7aa"/>
          <rect x="10" y="5" width="1" height="2" fill="#000"/><rect x="11" y="6" width="3" height="2" fill="#fed7aa"/>
          <rect x="9" y="7" width="4" height="1" fill="#451a03"/>
          <rect x="3" y="8" width="9" height="4" fill="#e52521"/><rect x="5" y="8" width="5" height="6" fill="#1d4ed8"/>
          <rect x="6" y="10" width="1" height="1" fill="#fbd000"/><rect x="9" y="10" width="1" height="1" fill="#fbd000"/>
          <rect x="1" y="9" width="2" height="3" fill="#fed7aa"/><rect x="12" y="9" width="2" height="3" fill="#fed7aa"/>
          <rect x="4" y="14" width="3" height="2" fill="#1d4ed8"/><rect x="9" y="14" width="3" height="2" fill="#1d4ed8"/>
          <rect x="3" y="16" width="4" height="2" fill="#78350f"/><rect x="9" y="16" width="4" height="2" fill="#78350f"/>
        </svg>
      </div>
      <div class="flex items-end gap-5">
        <div class="w-14 h-16 bg-gradient-to-r from-green-600 via-green-400 to-green-700 border-4 border-black border-b-0 relative">
          <div class="w-16 h-5 bg-gradient-to-r from-green-600 via-green-300 to-green-700 border-4 border-black -ml-2 -mt-1"></div>
        </div>
        <div class="hidden md:flex flex-col items-center">
          <div class="w-4 h-4 rounded-full bg-yellow-400 border-2 border-black"></div>
          <div class="w-2 h-32 bg-white border-x-2 border-black relative">
            <div class="w-10 h-6 bg-red-600 border-2 border-black absolute top-1 right-1.5 flex items-center justify-center text-[8px] font-pixel text-white">BM5</div>
          </div>
          <div class="w-8 h-4 bg-stone-500 border-2 border-black"></div>
        </div>
      </div>
    </div>
    <div class="mario-floor"></div>
  </div>
</section>

<script src="js/common.js"></script>
<script>
  document.getElementById('btnStart').addEventListener('click', () => {
    SoundFX.startGame();
    document.getElementById('titleScreen').style.opacity = '0';
    document.getElementById('titleScreen').style.transition = 'opacity .3s';
    setTimeout(() => { location.href = 'login.html'; }, 450);
  });
</script>
</body>
</html>
